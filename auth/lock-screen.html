<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Swift Nests Lock Screen">
  <title>Lock Screen - Swift Nests</title>

  <!-- Bootstrap CSS -->
  <link href="../assets/bootstrap/bootstrap-5.3.3-dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="../assets/css/style.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

  <div class="card shadow-sm p-4" style="max-width: 400px; width: 100%;">
    <div class="text-center mb-4">
      <img src="../assets/img/user-avatar.png" alt="User Avatar" class="rounded-circle" width="100" height="100" />
      <h5 class="mt-3 mb-1">Welcome back, John Doe</h5>
      <p class="text-muted small">Your session is locked. Please enter your password to continue.</p>
    </div>

    <form>
      <div class="mb-3">
        <label for="lockPassword" class="form-label">Password</label>
        <input type="password" class="form-control" id="lockPassword" placeholder="Enter your password" required />
      </div>
      <button type="submit" class="btn btn-dark w-100">Unlock</button>
    </form>

    <div class="text-center mt-3">
      <a href="login.html" class="text-decoration-none small">Not John? Sign in as another user</a>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="../assets/bootstrap/bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
