<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Swift Nests - Forgot Password">
  <title>Forgot Password - Swift Nests</title>

  <!-- Bootstrap CSS -->
  <link href="../assets/bootstrap/bootstrap-5.3.3-dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="../assets/css/style.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body class="bg-light">

  <!-- Navbar -->


  <!-- Forgot Password Section -->
  <section class="py-5 w-100 d-flex align-items-center justify-content-center"  style="min-height: 100vh;"> 
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h3 class="text-center fw-bold mb-4">Forgot Password</h3>
              <p class="text-center text-muted mb-4">Enter your email address and we'll send you a link to reset your password.</p>

              <!-- Forgot Password Form -->
              <form>
                <div class="mb-3">
                  <label for="email" class="form-label">Email address</label>
                  <input type="email" class="form-control" id="email" placeholder="Enter email" required>
                </div>
                <button type="submit" class="btn btn-dark w-100">Send Reset Link</button>
              </form>

              <div class="text-center mt-4">
                <a href="login.html" class="text-decoration-none small">Back to Login</a>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </section>


  <!-- Bootstrap JS -->
  <script src="../assets/bootstrap/bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
