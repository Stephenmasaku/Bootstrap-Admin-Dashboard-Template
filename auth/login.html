<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Swift Nests - Escrow Template Powered by Swift Escrow Enterprises">
  <title>Login - Swift Nests</title>

  <!-- Bootstrap CSS -->
  <link href="../assets/bootstrap/bootstrap-5.3.3-dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="../assets/css/style.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#"><img src="../assets/img/logo.png" style="height:48px;width:48px;"/> Swift Nests</a>
  
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 text-uppercase">
  <li class="nav-item">
    <a href="register.html" class="btn btn-light ms-2 mt-2 mt-lg-0">Register</a>
  </li>
   </ul>
      </div>
    </div>
  </nav>

  <!-- Login Section -->
  <section class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h3 class="text-center fw-bold mb-4">Sign In</h3>

             

              <!-- Login Form -->
              <form>
                <div class="mb-3">
                  <label for="email" class="form-label">Email address</label>
                  <input type="email" class="form-control" id="email" placeholder="Enter email" required>
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                  </div>
                  <a href="#" class="text-decoration-none small">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-dark w-100">Login</button>
              </form>

              <div class="text-center mt-4">
                <p class="mb-0">Don't have an account? <a href="register.html" class="text-decoration-none">Create Account</a></p>
              </div>
              
               <div class="text-center my-3 text-muted">OR</div>
              <!-- Social Login Buttons -->
              <div class="d-grid gap-2 mb-3">
                <button class="btn btn-outline-primary"><i class="bi bi-facebook me-2"></i>Login with Facebook</button>
                <button class="btn btn-outline-danger"><i class="bi bi-google me-2"></i>Login with Google</button>
                <button class="btn btn-outline-info"><i class="bi bi-linkedin me-2"></i>Login with LinkedIn</button>
              </div>


            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-secondary text-white py-3">
    <div class="container d-flex justify-content-between align-items-center flex-wrap">
      <div class="mb-2 mb-md-0">
        <small>&copy; 2025 Swift Nests. Powered by Swift Escrow Enterprises.</small>
      </div>
      <ul class="list-unstyled d-flex mb-0">
        <li class="ms-3"><a href="#" class="text-white text-decoration-none">Help</a></li>
        <li class="ms-3"><a href="#" class="text-white text-decoration-none">Terms and Conditions</a></li>
        <li class="ms-3"><a href="#" class="text-white text-decoration-none">Privacy Policy</a></li>
        <li class="ms-3"><a href="#" class="text-white text-decoration-none">FAQ</a></li>
      </ul>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="../assets/bootstrap/bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
